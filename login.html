<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acceso | Vidriería Garmendia</title>
<style>
  :root {
    --fondo: #f3f6f9;
    --tarjeta: #ffffff;
    --texto: #1f2933;
    --borde: #8e99a4;
    --azul: #1769bd;
    --azul-oscuro: #11528f;
    --error: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fondo: #12171c;
      --tarjeta: #1b222a;
      --texto: #e8edf2;
      --borde: #5c6874;
      --azul: #4a9be0;
      --azul-oscuro: #6fb2ee;
      --error: #f2b8b5;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--fondo); color: var(--texto);
    font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    padding: 24px;
  }
  .tarjeta {
    width: 100%; max-width: 420px; background: var(--tarjeta);
    padding: 36px 32px; border-radius: 14px;
    box-shadow: 0 2px 14px rgba(0,0,0,.08);
  }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .sub { margin: 0 0 24px; color: var(--borde); font-size: .95rem; }
  input {
    width: 100%; padding: 14px 16px; margin-bottom: 16px;
    font-size: 1.05rem; color: var(--texto); background: transparent;
    border: 1px solid var(--borde); border-radius: 10px;
  }
  input:focus { outline: 2px solid var(--azul); border-color: var(--azul); }
  button {
    font-size: 1.05rem; padding: 12px 22px; border-radius: 10px;
    border: 0; cursor: pointer; font-family: inherit;
  }
  .acceder { background: var(--azul); color: #fff; }
  .acceder:hover { background: var(--azul-oscuro); }
  .cliente {
    width: 100%; margin-top: 22px; background: transparent;
    color: var(--azul); border: 1px solid var(--azul);
  }
  .cliente:hover { background: var(--azul); color: #fff; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--azul); outline-offset: 2px; }
  .olvido { display: block; margin-top: 18px; font-size: .9rem; color: var(--azul); text-decoration: none; }
  .olvido:hover { text-decoration: underline; }
  .msg { min-height: 1.3em; margin: 0 0 12px; font-size: .92rem; color: var(--error); }
  .separador { margin: 22px 0 0; border-top: 1px solid var(--borde); opacity: .35; }
</style>
</head>
<body>
  <main class="tarjeta">
    <h1>Vidriería Garmendia</h1>
    <p class="sub">Ingresa con tu usuario o visita la página como cliente.</p>

    <p class="msg" id="msg" role="alert"></p>
    <input id="usuario" type="text" placeholder="Usuario" autocomplete="username">
    <input id="clave" type="password" placeholder="Contraseña" autocomplete="current-password">
    <button class="acceder" id="btnAcceder" type="button">Acceder</button>
    <a class="olvido" href="#" id="olvido">¿Olvidó su contraseña?</a>

    <hr class="separador">
    <button class="cliente" id="btnCliente" type="button">Soy cliente</button>
  </main>

<script>
  // ⚠️ Edita aquí los usuarios autorizados.
  // OJO: en un sitio estático estos datos son visibles para quien inspeccione el código.
  const USUARIOS = {
    "adminvidreria": "3Espejosreflectivos123"
  };

  const PAGINA_PRINCIPAL = "index.html"; // cambia si tu página inicial se llama distinto

  const msg = document.getElementById("msg");
  const usuario = document.getElementById("usuario");
  const clave = document.getElementById("clave");

  function entrar(rol, nombre) {
    sessionStorage.setItem("acceso", rol);
    if (nombre) sessionStorage.setItem("usuario", nombre);
    window.location.replace(PAGINA_PRINCIPAL);
  }

  function acceder() {
    const u = usuario.value.trim();
    if (USUARIOS[u] !== undefined && USUARIOS[u] === clave.value) {
      entrar("usuario", u);
    } else {
      msg.textContent = "Usuario o contraseña incorrectos.";
      clave.value = "";
      clave.focus();
    }
  }

  document.getElementById("btnAcceder").addEventListener("click", acceder);
  [usuario, clave].forEach(el =>
    el.addEventListener("keydown", e => { if (e.key === "Enter") acceder(); })
  );
  document.getElementById("btnCliente").addEventListener("click", () => entrar("cliente"));
  document.getElementById("olvido").addEventListener("click", e => {
    e.preventDefault();
    msg.textContent = "Comunícate con la vidriería para recuperar tu contraseña.";
  });
</script>
</body>
</html>
